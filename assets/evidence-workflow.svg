<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="t d"><title id="t">Evidence workflow</title><desc id="d">Maps and verified calculations support optional Astra explanations and human review. Evidence and provenance travel with each step.</desc><rect width="1200" height="230" rx="14" fill="#091722"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="24" y="30" width="264" height="150" rx="10" fill="#112533" stroke="#294452"/><text x="42" y="63" fill="#67dbd0" font-size="14">01 / OBSERVE</text><text x="42" y="104" fill="#eff8fa" font-size="22">2D + 3D views</text><text x="42" y="142" fill="#a2b8c1" font-size="13">Source · time · denominator</text><path d="M294 99 h18 m-5 -5 5 5 -5 5" stroke="#67dbd0" fill="none"/><rect x="320" y="30" width="264" height="150" rx="10" fill="#112533" stroke="#294452"/><text x="338" y="63" fill="#67dbd0" font-size="14">02 / CALCULATE</text><text x="338" y="104" fill="#eff8fa" font-size="22">Python + GIS</text><text x="338" y="142" fill="#a2b8c1" font-size="13">Distances · rates · graphs</text><path d="M590 99 h18 m-5 -5 5 5 -5 5" stroke="#67dbd0" fill="none"/><rect x="616" y="30" width="264" height="150" rx="10" fill="#112533" stroke="#294452"/><text x="634" y="63" fill="#67dbd0" font-size="14">03 / EXPLAIN</text><text x="634" y="104" fill="#eff8fa" font-size="22">Optional Astra</text><text x="634" y="142" fill="#a2b8c1" font-size="13">Evidence IDs · uncertainty</text><path d="M886 99 h18 m-5 -5 5 5 -5 5" stroke="#67dbd0" fill="none"/><rect x="912" y="30" width="264" height="150" rx="10" fill="#112533" stroke="#294452"/><text x="930" y="63" fill="#67dbd0" font-size="14">04 / REVIEW</text><text x="930" y="104" fill="#eff8fa" font-size="22">Domain specialist</text><text x="930" y="142" fill="#a2b8c1" font-size="13">Verify · revise · hand off</text><text x="24" y="211" fill="#a2b8c1" font-size="13">Reproducible evidence → explicit assumptions → reviewable claims. No browser API keys; no autonomous dispatch.</text></g></svg>